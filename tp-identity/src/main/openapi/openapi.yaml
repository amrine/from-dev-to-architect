openapi: 3.0.3
info:
  title: TeamPulse Identity API
  version: 0.1.0-SNAPSHOT
  description: Identity capabilities owned by tp-identity.
servers:
  - url: http://localhost:8080
    description: Default local and development server; configure the client base URL if the port changes.
tags:
  - name: Users
    description: Tenant-scoped user operations.
paths:
  /api/users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user in the current tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created in CREATING status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/DomainValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users in the current tenant
      responses:
        '200':
          description: Users visible in the current tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/users/invitations:
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Create an invitation in the current tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Invitation created in INVITED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/DomainValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    UserInput:
      type: object
      required: [email, firstName, lastName]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          pattern: '^[^\s@]+@[^\s@]+$'
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
    UserResponse:
      type: object
      required: [reference, email, firstName, lastName, status]
      properties:
        reference:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [INVITED, CREATING, ACTIVE, SUSPENDED, DEACTIVATED]
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    ValidationError:
      description: Request structure or required fields are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ConflictError:
      description: The requested operation conflicts with current user state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DomainValidationError:
      description: User business data is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
